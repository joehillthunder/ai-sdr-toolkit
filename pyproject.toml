[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "ai-sdr-toolkit"
version = "0.1.0"
description = "AI-native SDR & BD prospecting toolkit: signal-based scoring + agentic research, qualification, and personalization."
readme = "README.md"
requires-python = ">=3.10"
license = { text = "MIT" }
authors = [{ name = "Jonathan Hill" }]
dependencies = [
    "pyyaml>=6.0",
    "requests>=2.31",
]

[project.optional-dependencies]
live = ["anthropic>=0.40"]
dev = ["pytest>=7.4"]

[project.scripts]
sdr-toolkit = "sdr_toolkit.cli:main"

[tool.setuptools.packages.find]
include = ["sdr_toolkit*"]
